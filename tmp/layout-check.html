<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    font: 12px/1.4 Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
<iframe id="frame" src="../index.html?lang=en" style="width: 390px; height: 1200px; border: 0"></iframe>
<script>
  const frame = document.querySelector("#frame");

  frame.addEventListener("load", () => {
    const documentInFrame = frame.contentDocument;
    const viewportWidth = documentInFrame.documentElement.clientWidth;
    const wide = [...documentInFrame.querySelectorAll("*")]
      .map((node) => {
        const rect = node.getBoundingClientRect();
        return {
          tag: node.tagName.toLowerCase(),
          id: node.id || "",
          className: typeof node.className === "string" ? node.className : "",
          left: Math.round(rect.left),
          right: Math.round(rect.right),
          width: Math.round(rect.width),
          scrollWidth: node.scrollWidth,
          clientWidth: node.clientWidth,
          text: (node.textContent || "").trim().replace(/\s+/g, " ").slice(0, 90),
        };
      })
      .filter((item) => item.right > viewportWidth + 1 || item.scrollWidth > item.clientWidth + 1)
      .sort((a, b) => b.right - a.right)
      .slice(0, 30);

    document.body.textContent = JSON.stringify(
      {
        viewportWidth,
        documentScrollWidth: documentInFrame.documentElement.scrollWidth,
        bodyScrollWidth: documentInFrame.body.scrollWidth,
        wide,
      },
      null,
      2
    );
  });
</script>
